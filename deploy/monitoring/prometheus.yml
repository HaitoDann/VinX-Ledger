# Prometheus pour un nœud VinX Ledger (API sur 127.0.0.1:8545, réseau hôte).
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: vinx
    static_configs:
      - targets: ["127.0.0.1:8545"]
        labels:
          node: "local"
