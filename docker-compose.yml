version: "3.8"

# VinX Ledger — 3-validator testnet + TLS reverse proxy
#
# Usage:
#   docker compose up --build
#
# - node1  : nœud genesis, RPC interne sur :8545
# - node2/3: synchronisation depuis node1 via --sync-peer
# - caddy  : reverse proxy TLS, expose le RPC sur https://localhost (port 443)
#            et redirige HTTP→HTTPS sur le port 80.
#
# Accès après démarrage :
#   https://localhost/health          (cert auto-signé Caddy — à accepter)
#   https://localhost/faucet/request  (POST)
#   wss://localhost/ws
#
# Pour activer le faucet sur node1 :
#   1. cargo run -p vinx-wallet -- keygen --output deploy/faucet.json
#   2. Créer deploy/node1.toml avec : faucet_key_file = "/data/faucet.json"
#   3. Décommenter le volume ./deploy/node1.toml ci-dessous
#   4. Envoyer du VINX à l'adresse faucet depuis le wallet admin

services:

  # ── Caddy TLS reverse proxy ────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: vinx-caddy
    restart: unless-stopped
    ports:
      - "80:80"    # HTTP → redirection HTTPS
      - "443:443"  # HTTPS (cert auto-signé en local, Let's Encrypt sur VPS public)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - node1
    networks:
      - vinxnet

  # ── Nœud 1 (genesis) ──────────────────────────────────────────────────────
  node1:
    build: .
    container_name: vinx-node1
    restart: unless-stopped
    volumes:
      - node1-data:/data
      # Décommenter pour charger un config.toml personnalisé (faucet, admin_token…) :
      # - ./deploy/node1.toml:/config.toml:ro
    ports:
      - "8545:8545"   # RPC direct (debug interne, pas exposé publiquement)
      - "9001:9000"   # P2P
    command:
      - "--data-dir=/data"
      - "--rpc-listen=0.0.0.0:8545"
      - "--p2p-listen=/ip4/0.0.0.0/tcp/9000"
      - "--block-time=3"
    networks:
      - vinxnet
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8545/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Nœud 2 ────────────────────────────────────────────────────────────────
  node2:
    build: .
    container_name: vinx-node2
    restart: unless-stopped
    volumes:
      - node2-data:/data
    ports:
      - "8546:8545"
      - "9002:9000"
    command:
      - "--data-dir=/data"
      - "--rpc-listen=0.0.0.0:8545"
      - "--p2p-listen=/ip4/0.0.0.0/tcp/9000"
      - "--peers=/ip4/node1/tcp/9000"
      - "--sync-peer=http://node1:8545"
      - "--block-time=3"
    depends_on:
      node1:
        condition: service_healthy
    networks:
      - vinxnet

  # ── Nœud 3 ────────────────────────────────────────────────────────────────
  node3:
    build: .
    container_name: vinx-node3
    restart: unless-stopped
    volumes:
      - node3-data:/data
    ports:
      - "8547:8545"
      - "9003:9000"
    command:
      - "--data-dir=/data"
      - "--rpc-listen=0.0.0.0:8545"
      - "--p2p-listen=/ip4/0.0.0.0/tcp/9000"
      - "--peers=/ip4/node1/tcp/9000"
      - "--sync-peer=http://node1:8545"
      - "--block-time=3"
    depends_on:
      node1:
        condition: service_healthy
    networks:
      - vinxnet

volumes:
  node1-data:
  node2-data:
  node3-data:
  caddy-data:
  caddy-config:

networks:
  vinxnet:
    driver: bridge
