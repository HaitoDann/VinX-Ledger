version: "3.8"

# VinX Ledger — 3-validator testnet
#
# Usage:
#   docker compose up --build
#
# Validator 1 (node1) starts first and acts as the genesis node.
# Validators 2 and 3 sync from node1 via --sync-peer and connect via P2P.

services:
  node1:
    build: .
    container_name: vinx-node1
    volumes:
      - node1-data:/data
    ports:
      - "8545:8545"   # RPC
      - "9001:9000"   # P2P
    command:
      - "--data-dir=/data"
      - "--rpc-listen=0.0.0.0:8545"
      - "--p2p-listen=/ip4/0.0.0.0/tcp/9000"
      - "--block-time=3"
    networks:
      - vinxnet

  node2:
    build: .
    container_name: vinx-node2
    volumes:
      - node2-data:/data
    ports:
      - "8546:8545"
      - "9002:9000"
    command:
      - "--data-dir=/data"
      - "--rpc-listen=0.0.0.0:8545"
      - "--p2p-listen=/ip4/0.0.0.0/tcp/9000"
      - "--peers=/ip4/node1/tcp/9000"
      - "--sync-peer=http://node1:8545"
      - "--block-time=3"
    depends_on:
      - node1
    networks:
      - vinxnet

  node3:
    build: .
    container_name: vinx-node3
    volumes:
      - node3-data:/data
    ports:
      - "8547:8545"
      - "9003:9000"
    command:
      - "--data-dir=/data"
      - "--rpc-listen=0.0.0.0:8545"
      - "--p2p-listen=/ip4/0.0.0.0/tcp/9000"
      - "--peers=/ip4/node1/tcp/9000"
      - "--sync-peer=http://node1:8545"
      - "--block-time=3"
    depends_on:
      - node1
    networks:
      - vinxnet

volumes:
  node1-data:
  node2-data:
  node3-data:

networks:
  vinxnet:
    driver: bridge
