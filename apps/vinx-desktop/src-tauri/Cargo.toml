[package]
name = "vinx-desktop"
version = "0.2.0"
edition = "2021"
description = "VinX — portefeuille et validateur de bureau (Tauri)"
authors = ["VinX Labs"]

# Standalone workspace on purpose: Tauri pulls heavy GUI/system deps that must
# not enter the node's workspace or CI.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
hex = "0.4"
vinx-desktop-core = { path = "../../../crates/vinx-desktop-core" }
vinx-core = { path = "../../../crates/vinx-core" }
vinx-crypto = { path = "../../../crates/vinx-crypto" }
