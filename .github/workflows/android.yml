name: Android

# Compile l'application Android du portefeuille mobile (crates/vinx-mobile) :
#   vinx-X.Y.Z-android.apk
# - sur une pull request qui touche au portefeuille mobile : l'APK est un
#   artefact de l'exécution, à télécharger depuis l'onglet Actions ;
# - depuis release.yml, pour une version publiée ;
# - à la demande (onglet Actions → Android → Run workflow).
#
# Signature : si les secrets ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD et
# ANDROID_KEY_ALIAS sont configurés (Settings → Secrets and variables →
# Actions), l'APK est compilée en version « release » et signée avec cette clé
# fixe : une version s'installe alors par-dessus la précédente. Sans eux, elle
# est signée avec une clé de débogage différente à chaque compilation (il faut
# désinstaller, réinstaller et restaurer le portefeuille avec ses 12 mots).
# Créer la clé : docs/VERIFIER-UNE-RELEASE.md, section « Clé de l'APK ».

on:
  pull_request:
    paths:
      - "crates/vinx-mobile/**"
      - "crates/vinx-core/**"
      - "crates/vinx-crypto/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_B64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false

env:
  CARGO_TERM_COLOR: always

jobs:
  apk:
    name: APK Android
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen (même version que Cargo.lock)
        run: |
          v="$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')"
          echo "WASM_BINDGEN=$v" >>"$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Version
        run: |
          v="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "vinx-mobile") | .version')"
          echo "VERSION=$v" >>"$GITHUB_ENV"
      - name: Projet Android
        run: crates/vinx-mobile/capacitor/prepare.sh "$VERSION"
      - name: Compilation et signature de l'APK
        working-directory: crates/vinx-mobile/capacitor/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          out="$GITHUB_WORKSPACE/dist/vinx-$VERSION-android.apk"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            ./gradlew --no-daemon assembleRelease
            tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
            ks="$RUNNER_TEMP/vinx.keystore"
            echo "$KEYSTORE_B64" | base64 -d >"$ks"
            "$tools/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$tools/apksigner" sign --ks "$ks" --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --out "$out" "$RUNNER_TEMP/aligned.apk"
            rm -f "$ks"
            "$tools/apksigner" verify --print-certs "$out" | grep -E "SHA-256|DN"
            echo "APK signée avec la clé fixe du projet."
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$out"
            echo "::warning::Clé de signature absente : APK signée avec une clé de débogage (voir docs/VERIFIER-UNE-RELEASE.md)."
          fi
          ls -la "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
