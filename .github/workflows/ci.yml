name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  deny:
    name: Dépendances (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  poste:
    name: Poste ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p vinx-wallet -p vinx-keystore -p vinx-crypto
      - run: cargo build --locked -p vinx-node -p vinx-wallet
      # Comme pour la release : sans runtime Visual C++ à installer.
      - name: Vérifie les .exe autonomes
        if: runner.os == 'Windows'
        shell: bash
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          cargo build --locked -p vinx-wallet
          ! grep -aqi "vcruntime140.dll" target/debug/vinx-wallet.exe

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  fmt:
    name: Formatage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  alerts:
    name: Alertes Prometheus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifie et teste les règles d'alerte
        run: |
          docker run --rm -v "$PWD/deploy/monitoring:/m" -w /m \
            --entrypoint promtool prom/prometheus:v2.55.1 check rules alerts.yml
          docker run --rm -v "$PWD/deploy/monitoring:/m" -w /m \
            --entrypoint promtool prom/prometheus:v2.55.1 test rules alerts.test.yml
