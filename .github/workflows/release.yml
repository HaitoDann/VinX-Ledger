name: Release

# Pousser une étiquette vX.Y.Z (ou créer la release depuis l'interface GitHub,
# ce qui crée l'étiquette) publie :
#   vinx-X.Y.Z-linux-x86_64.tar.gz    serveur : binaires, script d'installation,
#                                     service systemd, supervision, guides
#   vinx-X.Y.Z-windows-x86_64.zip     poste d'administration : vinx-wallet et
#   vinx-X.Y.Z-macos-arm64.tar.gz     vinx-node (genèse, clés), guides
#   vinx-X.Y.Z-android.apk           portefeuille mobile (android.yml)
#   SHA256SUMS
# Chaque fichier reçoit une attestation de provenance GitHub (Sigstore) : elle
# prouve qu'il a été compilé par ce workflow, depuis ce dépôt et cette
# étiquette. Vérification : docs/VERIFIER-UNE-RELEASE.md.
# Voir docs/DEPLOYER-UN-VALIDATEUR.md.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifie que l'étiquette correspond à la version du code
        id: v
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "vinx-node") | .version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "étiquette $GITHUB_REF_NAME, mais Cargo.toml indique $version" >&2
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

  linux:
    name: Serveur Linux x86_64
    needs: version
    # Ubuntu 22.04 : glibc 2.35, compatible avec Debian 12 et Ubuntu 22.04 et plus.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p vinx-node -p vinx-wallet
      - name: Assemble l'archive
        run: |
          name="vinx-$VERSION-linux-x86_64"
          mkdir "$name"
          cp target/release/vinx-node target/release/vinx-wallet "$name/"
          cp -r deploy/install-validator.sh deploy/systemd deploy/monitoring deploy/public "$name/"
          cp docs/DEPLOYER-UN-VALIDATEUR.md docs/EXPLOITATION.md docs/PORTEFEUILLE.md docs/NOEUD-PUBLIC.md docs/TESTNET-2.md docs/JETONS.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: vinx-*.tar.gz

  poste:
    name: Poste ${{ matrix.label }}
    needs: version
    strategy:
      matrix:
        include:
          - os: windows-latest
            label: windows-x86_64
          - os: macos-latest
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked -p vinx-wallet -p vinx-keystore -p vinx-crypto
      - run: cargo build --release --locked -p vinx-node -p vinx-wallet
      - name: Vérifie que les .exe ne dépendent pas du runtime Visual C++
        if: runner.os == 'Windows'
        run: |
          for exe in target/release/vinx-wallet.exe target/release/vinx-node.exe; do
            if grep -aqi "vcruntime140.dll" "$exe"; then
              echo "$exe dépend encore de VCRUNTIME140.dll" >&2
              exit 1
            fi
            "$exe" --version
          done
      - name: Assemble l'archive
        run: |
          name="vinx-$VERSION-${{ matrix.label }}"
          mkdir "$name"
          ext=""
          [ "${{ runner.os }}" = Windows ] && ext=".exe"
          cp "target/release/vinx-wallet$ext" "target/release/vinx-node$ext" "$name/"
          cp docs/DEPLOYER-UN-VALIDATEUR.md docs/EXPLOITATION.md docs/PORTEFEUILLE.md docs/TESTNET-2.md docs/JETONS.md LICENSE "$name/"
          if [ "${{ runner.os }}" = Windows ]; then
            7z a "$name.zip" "$name" >/dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            vinx-*.zip
            vinx-*.tar.gz

  android:
    name: Android
    needs: version
    uses: ./.github/workflows/android.yml
    # Clé de signature fixe de l'APK, si elle est configurée (voir android.yml).
    secrets: inherit

  publish:
    name: Publication
    needs: [version, linux, poste, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sommes de contrôle
        working-directory: dist
        run: sha256sum vinx-* >SHA256SUMS
      - name: Attestation de provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/vinx-*
            dist/SHA256SUMS
      - name: Publie la release
        working-directory: dist
        # La release peut déjà exister si elle a été créée depuis l'interface
        # GitHub : on y ajoute alors les fichiers.
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "VinX Ledger $VERSION" \
              --notes "Installation et mise à jour : DEPLOYER-UN-VALIDATEUR.md, inclus dans les archives. Vérifier l'authenticité des fichiers : docs/VERIFIER-UNE-RELEASE.md."
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber vinx-* SHA256SUMS
