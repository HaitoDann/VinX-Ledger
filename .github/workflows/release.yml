name: Release

# Pousser une étiquette v0.2.0 publie une release GitHub avec l'archive
# vinx-0.2.0-linux-x86_64.tar.gz : binaires, script d'installation, service
# systemd, supervision. Voir docs/DEPLOYER-UN-VALIDATEUR.md.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    name: Binaires Linux x86_64
    # Ubuntu 22.04 : glibc 2.35, compatible avec Debian 12 et Ubuntu 22.04 et plus.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Vérifie que l'étiquette correspond à la version du code
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "vinx-node") | .version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "étiquette $GITHUB_REF_NAME, mais Cargo.toml indique $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >>"$GITHUB_ENV"

      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p vinx-node -p vinx-wallet

      - name: Assemble l'archive
        run: |
          name="vinx-$VERSION-linux-x86_64"
          mkdir "$name"
          cp target/release/vinx-node target/release/vinx-wallet "$name/"
          cp -r deploy/install-validator.sh deploy/systemd deploy/monitoring "$name/"
          cp docs/DEPLOYER-UN-VALIDATEUR.md docs/EXPLOITATION.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" >SHA256SUMS

      - name: Publie la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "VinX Ledger $VERSION" \
            --notes "Installation et mise à jour : DEPLOYER-UN-VALIDATEUR.md, inclus dans l'archive." \
            vinx-*.tar.gz SHA256SUMS
