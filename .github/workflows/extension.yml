name: Browser extension

# Tests the VinX Wallet extension and packages it as a zip, ready to load unpacked
# or to submit to the Chrome Web Store / Firefox Add-ons.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["apps/vinx-extension/**", ".github/workflows/extension.yml"]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test the wallet core
        run: node apps/vinx-extension/test.mjs
      - name: Package
        id: pack
        run: |
          v=$(node -p "require('./apps/vinx-extension/manifest.json').version")
          cd apps/vinx-extension
          zip -r -X "../../vinx-wallet-$v.zip" . -x test.mjs README.md
          echo "file=vinx-wallet-$v.zip" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: vinx-wallet
          path: ${{ steps.pack.outputs.file }}
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.file }}
