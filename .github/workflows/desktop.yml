name: Desktop app

# Installers of the VinX desktop app (wallet + validator) for Windows, macOS and
# Linux, each bundling the vinx-node binary it runs as the validator.
on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux,           os: ubuntu-22.04 }
          - { name: Windows,         os: windows-latest }
          - { name: macOS (Apple),   os: macos-14 }
          - { name: macOS (Intel),   os: macos-15-intel }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build the node
        run: cargo build --release -p vinx-node

      - name: Bundle the node next to the app
        shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          ext=""; [[ "$RUNNER_OS" == "Windows" ]] && ext=".exe"
          mkdir -p apps/vinx-desktop/src-tauri/binaries
          out="apps/vinx-desktop/src-tauri/binaries/vinx-node-$triple$ext"
          cp "target/release/vinx-node$ext" "$out"
          # Release builds keep debug info for crash reports; the installer does not need it.
          [[ "$RUNNER_OS" != "Windows" ]] && strip "$out" || true

      - name: Icons
        working-directory: apps/vinx-desktop
        run: npx --yes @tauri-apps/cli@2 icon app-icon.png

      - name: Build installers
        working-directory: apps/vinx-desktop
        run: npx --yes @tauri-apps/cli@2 build

      - uses: actions/upload-artifact@v4
        with:
          name: VinX-${{ runner.os }}-${{ matrix.os }}
          path: |
            apps/vinx-desktop/src-tauri/target/release/bundle/**/*.deb
            apps/vinx-desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/vinx-desktop/src-tauri/target/release/bundle/**/*.msi
            apps/vinx-desktop/src-tauri/target/release/bundle/**/*-setup.exe
            apps/vinx-desktop/src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: error

      # On a version tag, the installers go to the GitHub Release: direct download
      # links, no GitHub account needed.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/vinx-desktop/src-tauri/target/release/bundle/**/*.deb
            apps/vinx-desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/vinx-desktop/src-tauri/target/release/bundle/**/*.msi
            apps/vinx-desktop/src-tauri/target/release/bundle/**/*-setup.exe
            apps/vinx-desktop/src-tauri/target/release/bundle/**/*.dmg
