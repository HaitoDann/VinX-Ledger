[package]
name = "vinx-node"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "vinx-node"
path = "src/main.rs"

[dependencies]
vinx-crypto = { path = "../vinx-crypto" }
vinx-core = { path = "../vinx-core" }
vinx-state = { path = "../vinx-state" }
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
libp2p = { version = "0.54", features = ["gossipsub", "noise", "tcp", "yamux", "tokio", "identify", "mdns", "macros", "quic", "kad", "dns", "upnp", "autonat", "relay", "dcutr"] }
borsh = { workspace = true }
rayon = { workspace = true }
futures = "0.3"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-stream = { version = "0.1", features = ["sync"] }
igd-next = { version = "0.14", features = ["aio_tokio"] }
redb = "2"
bloomfilter = "1"
zstd = { workspace = true }
lru = "0.12"
ahash = { version = "0.8", features = ["serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { workspace = true }
