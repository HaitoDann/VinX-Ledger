<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VinX Ledger — API</title>
<link rel="icon" href="__FAVICON__">
<style>/*__THEME__*/
main { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; } #toc { position: static !important; } }
#toc { position: sticky; top: 14px; display: grid; gap: 2px; font-size: 13px; }
#toc b { margin: 10px 0 4px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
#toc b:first-child { margin-top: 0; }
#toc a { padding: 3px 6px; border-radius: 6px; color: var(--text); }
#toc a:hover { background: var(--accent-soft); text-decoration: none; }
#content { display: grid; gap: 14px; min-width: 0; }
.op { border-top: 1px solid var(--line); padding: 14px 0 4px; scroll-margin-top: 80px; }
.intro { scroll-margin-top: 80px; }
.op h3 { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 6px; font-size: 14px; }
.verb { font: 700 11px/1 ui-monospace, monospace; padding: 4px 7px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); }
.verb.post { background: rgba(245, 165, 36, .14); color: var(--warn); }
.op p { margin: 4px 0; color: var(--muted); line-height: 1.5; }
.op p b.title { color: var(--text); }
.op table { margin: 8px 0; font-size: 13px; }
pre { margin: 8px 0; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: auto; font-size: 12px; max-height: 360px; }
.try { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
.try input { flex: 1; min-width: 160px; }
.intro p, .intro li { line-height: 1.55; }
code { font-family: ui-monospace, monospace; font-size: .92em; background: var(--panel); padding: 1px 5px; border-radius: 4px; }
pre code { background: none; padding: 0; }
</style>
</head>
<body>
<header>
  <a class="brand" href="/docs">
    <!--__LOGO__-->
    <span><b>VinX <span>Ledger</span></b><small>API</small></span>
  </a>
  <nav>
    <a href="/explorer">Explorateur</a>
    <a href="/">Nœud</a>
    <a href="/openapi.json">openapi.json</a>
  </nav>
  <span id="version" class="pill"></span>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Thème clair ou sombre" title="Thème clair ou sombre">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>
<script>
(() => {
  const root = document.documentElement, key = "vinx-theme";
  try { const t = localStorage.getItem(key); if (t) root.dataset.theme = t; } catch (_) {}
  document.getElementById("themeToggle").addEventListener("click", () => {
    const t = root.dataset.theme === "light" ? "dark" : "light";
    root.dataset.theme = t;
    try { localStorage.setItem(key, t); } catch (_) {}
  });
})();
</script>
<main>
  <nav id="toc" class="card"></nav>
  <div id="content"><section class="card"><p class="sub">Chargement de la description…</p></section></div>
</main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
  .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => /^(https?:|\/)/.test(u) ? `<a href="${u}">${t}</a>` : t);
/* Markdown minimal des descriptions : paragraphes, listes « - », `code`, **gras**, liens. */
function md(text) {
  return String(text || "").split(/\n{2,}/).map(b => {
    const lines = b.split("\n");
    if (lines.every(l => l.startsWith("- "))) return "<ul>" + lines.map(l => `<li>${inline(l.slice(2))}</li>`).join("") + "</ul>";
    return `<p>${inline(b)}</p>`;
  }).join("");
}
const slug = (m, p) => (m + p).replace(/[^a-z0-9]+/gi, "-");
const deref = (spec, s) => s && s.$ref ? spec.components.schemas[s.$ref.split("/").pop()] : s;

/* Exemple de réponse construit depuis le schéma. */
function example(spec, schema, depth = 0) {
  schema = deref(spec, schema);
  if (!schema || depth > 6) return null;
  if ("example" in schema) return schema.example;
  if (schema.type === "array") return [example(spec, schema.items, depth + 1)];
  if (schema.properties) {
    const o = {};
    for (const [k, v] of Object.entries(schema.properties)) o[k] = example(spec, v, depth + 1);
    return o;
  }
  return { string: "…", integer: 0, boolean: false, number: 0, object: {} }[schema.type] ?? null;
}

/* Champs décrits d'un schéma (premier niveau), pour le tableau « Champs ». */
function fields(spec, schema) {
  schema = deref(spec, schema);
  if (!schema?.properties) return "";
  const rows = Object.entries(schema.properties).filter(([, v]) => deref(spec, v)?.description || deref(spec, v.items)?.description)
    .map(([k, v]) => `<tr><td class="mono">${esc(k)}</td><td>${inline(deref(spec, v).description || deref(spec, v.items).description)}</td></tr>`).join("");
  return rows ? `<div class="scroll"><table><thead><tr><th>Champ</th><th>Signification</th></tr></thead><tbody>${rows}</tbody></table></div>` : "";
}

function opHtml(spec, { path, method, op }) {
  const rows = (op.parameters || []).map(p => `<tr><td class="mono">${esc(p.name)}</td><td>${p.in === "path" ? "chemin" : "requête"}${p.required ? "" : ", facultatif"}</td><td>${inline(p.description)}</td></tr>`).join("");
  const ok = op.responses?.["200"]?.content?.["application/json"]?.schema;
  const body = op.requestBody?.content?.["application/json"]?.schema;
  const id = slug(method, path);
  const sample = path.replace(/\{(\w+)\}/g, (m, n) => (op.parameters || []).find(p => p.name === n)?.schema?.example ?? m);
  const tryIt = method === "get"
    ? `<div class="try"><input class="mono" value="${esc(sample)}" data-try="${id}" aria-label="Requête"><button data-run="${id}">Essayer</button></div><pre hidden id="out-${id}"></pre>` : "";
  return `<div class="op" id="${id}">
    <h3><span class="verb ${method}">${method.toUpperCase()}</span><span class="mono">${esc(path)}</span></h3>
    <p><b class="title">${esc(op.summary)}</b></p>${md(op.description)}
    ${rows ? `<div class="scroll"><table><thead><tr><th>Paramètre</th><th>Où</th><th>Description</th></tr></thead><tbody>${rows}</tbody></table></div>` : ""}
    ${body ? `<p>Corps de la requête :</p><pre><code>${esc(JSON.stringify(example(spec, body), null, 2))}</code></pre>` : ""}
    ${ok ? `<p>Exemple de réponse :</p><pre><code>${esc(JSON.stringify(example(spec, ok), null, 2))}</code></pre>${fields(spec, ok)}` : ""}
    ${tryIt}</div>`;
}

function render(spec) {
  document.getElementById("version").textContent = "v" + spec.info.version;
  const groups = new Map(spec.tags.map(t => [t.name, { tag: t, ops: [] }]));
  for (const [path, item] of Object.entries(spec.paths))
    for (const [method, op] of Object.entries(item)) groups.get(op.tags[0])?.ops.push({ path, method, op });
  const toc = ['<b>Pour commencer</b><a href="#intro">Conventions</a>'];
  const html = [`<section class="card intro" id="intro"><h1>${esc(spec.info.title)}</h1>${md(spec.info.description)}</section>`];
  for (const { tag, ops } of groups.values()) {
    toc.push(`<b>${esc(tag.name)}</b>` + ops.map(o => `<a href="#${slug(o.method, o.path)}">${esc(o.op.summary)}</a>`).join(""));
    html.push(`<section class="card"><h2>${esc(tag.name)}</h2>${md(tag.description)}${ops.map(o => opHtml(spec, o)).join("")}</section>`);
  }
  document.getElementById("toc").innerHTML = toc.join("");
  document.getElementById("content").innerHTML = html.join("");
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
}

document.addEventListener("click", async e => {
  const id = e.target.dataset?.run;
  if (!id) return;
  const url = document.querySelector(`[data-try="${id}"]`).value.trim();
  const out = document.getElementById("out-" + id);
  out.hidden = false;
  if (!url.startsWith("/")) { out.textContent = "La requête doit commencer par « / »."; return; }
  out.textContent = "…";
  try {
    const r = await fetch(url);
    const text = await r.text();
    let shown = text;
    try { shown = JSON.stringify(JSON.parse(text), null, 2); } catch (_) {}
    out.textContent = `${r.status} ${r.statusText}\n\n${shown}`;
  } catch (err) { out.textContent = String(err); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.dataset?.try) document.querySelector(`[data-run="${e.target.dataset.try}"]`).click();
});

fetch("/openapi.json").then(r => r.json()).then(render).catch(err => {
  document.getElementById("content").innerHTML = `<section class="card"><p class="bad">Description indisponible : ${esc(err)}</p></section>`;
});
</script>
</body>
</html>
