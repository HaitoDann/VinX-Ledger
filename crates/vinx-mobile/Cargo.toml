[package]
name = "vinx-mobile"
description = "Portefeuille mobile VinX Ledger : clés et signature en WebAssembly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vinx-crypto.workspace = true
vinx-core.workspace = true
blake3.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
bip39 = { version = "2", default-features = false, features = ["std"] }
getrandom = "0.2"
wasm-bindgen = "0.2"
# QR codes : affichage (Recevoir) et lecture par la caméra (Scanner).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rqrr = "0.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
