[workspace]
members = [
    "crates/vinx-crypto",
    "crates/vinx-core",
    "crates/vinx-state",
    "crates/vinx-node",
    "crates/vinx-wallet",
    "crates/vinx-desktop-core",
]
# The Tauri desktop shell is its own workspace: it pulls heavy GUI/system
# dependencies (webkit, etc.) that must not affect the node's build or CI.
exclude = ["apps/vinx-desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
authors = ["VinX Labs"]

# Optimized release binaries: thin LTO + a single codegen unit typically buy
# 10-20% on the hot paths (Ed25519 verification, hashing, serialization) for
# slower-but-rare release builds. Debug info stays on for usable backtraces.
[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

[workspace.dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
blake3 = "1"
bech32 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bincode = "1"
borsh = { version = "1", features = ["derive"] }
rayon = "1"
zstd = "0.13"
blst = "0.3"
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }
