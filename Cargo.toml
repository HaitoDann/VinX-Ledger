[workspace]
exclude = ["fuzz"]
members = [
    "crates/vinx-crypto",
    "crates/vinx-core",
    "crates/vinx-state",
    "crates/vinx-consensus",
    "crates/vinx-keystore",
    "crates/vinx-node",
    "crates/vinx-wallet",
    "crates/vinx-mobile",
]
resolver = "3"

[workspace.package]
version = "0.27.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/HaitoDann/VinX-Ledger"

[workspace.dependencies]
vinx-crypto = { path = "crates/vinx-crypto" }
vinx-core = { path = "crates/vinx-core" }
vinx-state = { path = "crates/vinx-state" }
vinx-consensus = { path = "crates/vinx-consensus" }
vinx-keystore = { path = "crates/vinx-keystore" }
vinx-node = { path = "crates/vinx-node" }
vinx-mobile = { path = "crates/vinx-mobile" }
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
bech32 = "0.9"
blake3 = "1"
borsh = { version = "1", features = ["derive", "rc"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
imbl = "7"
proptest = "1"
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
libp2p = { version = "0.54", features = ["tokio", "tcp", "noise", "yamux", "gossipsub", "request-response", "macros"] }
argon2 = "0.5"
axum = "0.8"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
http-body-util = "0.1"
redb = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tower = { version = "0.5", features = ["util", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rayon = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

# Toute arithmétique doit être explicite (checked_*, saturating_*) : un
# dépassement silencieux sur un montant ou une hauteur est un bug de consensus.
# Un panic dans le nœud est un déni de service : pas d'unwrap ni d'expect hors tests.
[workspace.lints.clippy]
arithmetic_side_effects = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"

# Les dépendances (cryptographie) optimisées même en debug : tests bien plus rapides.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
